<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanChef - Cocina de Aprovechamiento</title>
    <style>
        :root {
            --primary-green: #16382B;
            --accent-green: #2E6F50;
            --bg-light: #F4F7F5;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-dark: #222222;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, #ffffff 0%, #e8f0ec 100%);
            min-height: 100vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .header h1 {
            color: var(--primary-green);
            font-size: 28px;
            margin-bottom: 5px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(22, 56, 43, 0.1);
            text-align: center;
            margin: 20px 0;
        }
        .btn {
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(22, 56, 43, 0.3);
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: var(--accent-green);
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ScanChef</h1>
            <p>Reduce el desperdicio, crea recetas mágicas</p>
        </div>
        
        <div class="card">
            <h3 style="color: var(--primary-green); margin-top: 0;">Escanea tu refrigerador</h3>
            <p style="font-size: 14px; color: #555;">Sube una foto de tus ingredientes y obtén opciones instantáneas de cero compras extras.</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <button class="btn" onclick="document.getElementById('fileInput').click();">Escanear Ingredientes</button>
        </div>

        <div class="footer">
            <p>Desarrollado con inteligencia artificial • Cero Desperdicio</p>
        </div>
    </div>
</body>
</html>
